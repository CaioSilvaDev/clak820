name: Release

# Ao criar uma tag v* (ex.: git tag v0.1.0 && git push --tags), gera o .zip
# e o instalador e publica na aba Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*-setup.exe
            dist/*.zip
          generate_release_notes: true
